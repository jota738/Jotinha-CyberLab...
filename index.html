
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOTINHA CYBERLAB</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080b14;
  color: #e8f1ff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
}
main {
  width: 100%;
  max-width: 520px;
  background: #101728;
  border: 1px solid #263b61;
  border-radius: 18px;
  padding: 28px;
  box-shadow: 0 0 35px #1765a533;
}
h1 {
  color: #48d9ff;
  text-align: center;
  letter-spacing: 2px;
}
.subtitle {
  text-align: center;
  color: #9babc7;
  font-size: 13px;
}
label { display: block; margin-top: 17px; color: #aabce0; }
input {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  background: #080e1b;
  border: 1px solid #304b73;
  border-radius: 8px;
  color: white;
  outline: none;
}
input:focus { border-color: #48d9ff; }
button {
  width: 100%;
  margin-top: 25px;
  padding: 14px;
  background: linear-gradient(90deg,#087fc1,#713cda);
  border: 0;
  border-radius: 8px;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
#resultado {
  display: none;
  margin-top: 22px;
  padding: 17px;
  background: #081b20;
  border: 1px solid #16c99a;
  border-radius: 10px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}
footer {
  text-align: center;
  color: #687b9b;
  font-size: 11px;
  margin-top: 25px;
}
</style>
</head>
<body>
<main>
  <h1>JOTINHA CYBERLAB</h1>
  <p class="subtitle">TECHNOLOGY • PROGRAMMING • INNOVATION</p>

  <h3>Meu perfil tecnológico</h3>

  <label>Seu nome</label>
  <input id="nome" placeholder="Digite seu nome">

  <label>Sua idade</label>
  <input id="idade" type="number" placeholder="Digite sua idade">

  <label>Linguagem favorita</label>
  <input id="linguagem" placeholder="Ex: Python">

  <label>Jogo favorito</label>
  <input id="jogo" placeholder="Digite seu jogo favorito">

  <label>Seu sonho profissional</label>
  <input id="sonho" placeholder="Digite seu objetivo">

  <button onclick="executar()">EXECUTAR PROGRAMA</button>

  <div id="resultado"></div>

  <footer>JOTINHA CYBERLAB © 2026 — VERSION 1.0</footer>
</main>

<script>
function executar() {
  const nome = document.getElementById("nome").value.trim();
  const idade = document.getElementById("idade").value;
  const linguagem = document.getElementById("linguagem").value.trim();
  const jogo = document.getElementById("jogo").value.trim();
  const sonho = document.getElementById("sonho").value.trim();

  if (!nome || !idade || !linguagem || !jogo || !sonho) {
    alert("Preencha todos os campos!");
    return;
  }

  const resultado = document.getElementById("resultado");
  resultado.replaceChildren();

  const titulo = document.createElement("h3");
  titulo.textContent = "✓ PROGRAMA EXECUTADO";

  const dados = [
    ["Nome", nome],
    ["Idade", idade],
    ["Linguagem", linguagem],
    ["Jogo", jogo],
    ["Objetivo", sonho]
  ];

  resultado.appendChild(titulo);

  dados.forEach(([chave, valor]) => {
    const linha = document.createElement("p");
    linha.textContent = chave + ": " + valor;
    resultado.appendChild(linha);
  });

  resultado.style.display = "block";
}
</script>
</body>
</html>
